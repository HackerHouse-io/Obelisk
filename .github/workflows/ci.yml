name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck + lint + format + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      # keytar links against libsecret on Linux; ubuntu-latest images don't ship it.
      - name: Install libsecret (keytar runtime dep on Linux)
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Install
        run: pnpm install --frozen-lockfile
      # `pnpm verify` runs the same gates the pre-push hook runs locally:
      # typecheck → lint → format:check → test. Single source of truth.
      - name: Verify
        run: pnpm verify
